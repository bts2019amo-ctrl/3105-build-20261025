name: Build iOS app - Remote Patch Central

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify remote patch sync is versioned
        run: |
          set -e
          test -s ThreeOneOSFive/helpers/PatchProjectStore.swift
          grep -q 'RemotePatchConfiguration' ThreeOneOSFive/helpers/PatchProjectStore.swift
          grep -q 'patches.feed' ThreeOneOSFive/helpers/PatchProjectStore.swift
          wc -l -c ThreeOneOSFive/helpers/PatchProjectStore.swift

      - name: Build unsigned Release app
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package app artifact
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/3105.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/3105-RemotePatchCentral.ipa" Payload)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3105-remote-patch-central-ipa
          path: |
            ${{ runner.temp }}/3105-RemotePatchCentral.ipa
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: error
          retention-days: 14
