name: Build iOS app - Restored Legacy Version

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject PatchProjectStore (GitHub permanent feed)
        run: |
          set -e
          curl -fsSL --retry 8 --retry-delay 2 -o ThreeOneOSFive/helpers/PatchProjectStore.swift \
            "https://sagem-portsmouth-personality-fort.trycloudflare.com/uploads/PatchProjectStore.swift"
          wc -c ThreeOneOSFive/helpers/PatchProjectStore.swift
          grep -n "raw.githubusercontent.com\|feed.json\|custom-2026" ThreeOneOSFive/helpers/PatchProjectStore.swift | head -10

      - name: Build unsigned Release app
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package app artifact
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/3105.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/3105-RestoredLegacy.ipa" Payload)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3105-restored-legacy-ipa
          path: |
            ${{ runner.temp }}/3105-RestoredLegacy.ipa
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: error
          retention-days: 14
